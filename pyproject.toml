[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "th2822d-cli"
version = "0.1.3"
description = "Linux command-line control and data acquisition for the Tonghui TH2822D LCR meter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]
license = "MIT"
authors = [{name = "LHX369963"}]
keywords = ["lcr", "scpi", "serial", "th2822d", "tonghui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.16"]

[project.scripts]
th2822d = "th2822d_cli.cli:main"

[tool.setuptools]
packages = ["th2822d_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
